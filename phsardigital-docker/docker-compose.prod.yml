name: phsardigital-api

services:
  api:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    container_name: phsardigital-api
    environment:
      SERVER_PORT: 8999
      DB_URL: ${DB_URL:-jdbc:postgresql://phsardigital-db:5432/phsardigital_db}
      DB_USERNAME: ${POSTGRES_USER:-phsardigital}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-update}
      JWT_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:?KEYCLOAK_ISSUER_URI is required}
      JWT_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://phsardigital-kc:8080/realms/phsardigital/protocol/openid-connect/certs}
      KEYCLOAK_SERVER_URL: ${KEYCLOAK_INTERNAL_URL:-http://phsardigital-kc:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-phsardigital}
      KEYCLOAK_TARGET_REALM: ${KEYCLOAK_REALM:-phsardigital}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-phsar_digital_client}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?KEYCLOAK_CLIENT_SECRET is required}
      MINIO_URL: ${MINIO_INTERNAL_URL:-http://phsardigital-minio:9000}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?MINIO_PUBLIC_URL is required}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-products}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8999}:8999"
    networks:
      - existing-infrastructure
    restart: unless-stopped

networks:
  existing-infrastructure:
    external: true
    name: ${DOCKER_NETWORK:-phsardigital}
