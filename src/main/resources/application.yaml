minio:
  url: ${MINIO_URL:http://localhost:9000}
  public-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:admin}
  secret-key: ${MINIO_SECRET_KEY:admin123}
  # Anonymously readable: avatars, listing images, category icons.
  bucket: ${MINIO_BUCKET:products}
  # No bucket policy at all: seller identity documents and business licences,
  # reachable only through a presigned URL.
  private-bucket: ${MINIO_PRIVATE_BUCKET:documents}
  auto-create-bucket: ${MINIO_AUTO_CREATE_BUCKET:true}
  public-read: ${MINIO_PUBLIC_READ:true}
  max-image-size: ${MINIO_MAX_IMAGE_SIZE:5MB}
  max-document-size: ${MINIO_MAX_DOCUMENT_SIZE:10MB}
  presigned-url-expiry: ${MINIO_PRESIGNED_URL_EXPIRY:15m}
  # Only formats FileTypeDetector can identify by their leading bytes are usable
  # here; anything else is rejected on upload regardless of what the client says.
  allowed-image-types: ${MINIO_ALLOWED_IMAGE_TYPES:image/jpeg,image/png,image/webp,image/gif}
  # Business licences arrive as scans, PDFs and Word files alike, so all three are
  # accepted. The Office entries match any ZIP/OLE2 container — see FileTypeDetector
  # for why that is tolerable here and nowhere else.
  allowed-document-types: ${MINIO_ALLOWED_DOCUMENT_TYPES:application/pdf,image/jpeg,image/png,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/msword}

spring:
  application:
    name: phsardigital
  lifecycle:
    timeout-per-shutdown-phase: 30s
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 200MB
  datasource:
    username: ${DB_USERNAME:phsardigital}
    password: ${DB_PASSWORD:qwer}
    url: ${DB_URL:jdbc:postgresql://localhost:8888/phsardigital_db}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:7777/realms/phsardigital}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:7777/realms/phsardigital/protocol/openid-connect/certs}

springdoc:
  swagger-ui:
    # Keeps the pasted token across page reloads so it is not re-entered constantly.
    persist-authorization: true
    tags-sorter: alpha
    operations-sorter: alpha

server:
  port: ${SERVER_PORT:8999}
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

keycloak:
  server-url: ${KEYCLOAK_SERVER_URL:http://localhost:7777}
  realm: ${KEYCLOAK_REALM:phsardigital}
  client-id: ${KEYCLOAK_CLIENT_ID:phsardigital-client}
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  target-realm: ${KEYCLOAK_TARGET_REALM:phsardigital}

app:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    # Everything under /api/v1/auth is anonymous, and every POST there is expensive:
    # registration makes three Keycloak admin calls, and the other two exist to send
    # mail to an address the caller names. Both limits below are per process — behind
    # two instances the effective rate is roughly doubled.
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      # Per client address, over every POST under /api/v1/auth. Five back to back
      # leaves room for a mistyped form; the bucket refills over the period.
      requests: ${AUTH_RATE_LIMIT_REQUESTS:5}
      period: ${AUTH_RATE_LIMIT_PERIOD:1m}
      # Per email address, counted separately for verification and for reset. Stops a
      # caller spread across many source addresses from burying one person's inbox,
      # which the per-address limit above cannot see.
      emails-per-address: ${AUTH_RATE_LIMIT_EMAILS_PER_ADDRESS:3}
      email-period: ${AUTH_RATE_LIMIT_EMAIL_PERIOD:1h}
      max-tracked-keys: ${AUTH_RATE_LIMIT_MAX_TRACKED_KEYS:50000}
  maps:
    # Shop locations can be set by pasting a Google Maps link. The mobile app's Share
    # button produces a maps.app.goo.gl redirect, which has to be followed to see the
    # coordinates — set this false in an environment with no outbound access, and
    # sellers there must send latitude and longitude instead.
    resolve-short-links: ${MAPS_RESOLVE_SHORT_LINKS:true}
    short-link-timeout: ${MAPS_SHORT_LINK_TIMEOUT:3s}
  error:
    # Adds the exception type, its cause chain, and the first application stack
    # frame to error responses. Defaults on so failures are diagnosable while
    # developing; set ERROR_INCLUDE_EXCEPTION_DETAILS=false in production, where
    # internal class names and line numbers should not leave the server.
    include-exception-details: ${ERROR_INCLUDE_EXCEPTION_DETAILS:true}
